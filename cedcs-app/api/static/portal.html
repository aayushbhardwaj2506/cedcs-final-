<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hospital Portal</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--acc:#2563eb;--ok:#0a7d3c;--bad:#b00020;--warn:#b45309}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--ink:#e6edf7;--mut:#94a3b8;--line:#243049;--acc:#60a5fa;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,Segoe UI,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
header h1{font-size:18px;margin:0;flex:1}header a{color:var(--acc);text-decoration:none;font-weight:600}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:13px}.live i{width:9px;height:9px;border-radius:50%;background:var(--ok);animation:p 1.6s infinite}@keyframes p{50%{opacity:.25}}
main{max-width:860px;margin:0 auto;padding:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 14px}
.pri{display:inline-block;padding:2px 12px;border-radius:99px;font-weight:700;font-size:13px;background:#fee2e2;color:var(--bad)}.pri.HIGH{background:#ffedd5;color:var(--warn)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.mut{color:var(--mut);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px;margin:10px 0}
.k{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}.chip{display:inline-block;padding:1px 9px;margin:2px 4px 2px 0;border:1px solid var(--line);border-radius:99px;font-size:13px}
button{font:inherit;padding:9px 16px;border:0;border-radius:8px;font-weight:600;cursor:pointer;color:#fff;background:var(--acc)}button.no{background:var(--bad)}button.ok{background:var(--ok)}button[disabled]{opacity:.5}
input{font:inherit;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.ans{padding:8px 12px;border-radius:8px;font-weight:600}.ans.ACCEPTED{background:#dcfce7;color:var(--ok)}.ans.DECLINED{background:#fee2e2;color:var(--bad)}.stale{opacity:.6}
.empty{text-align:center;color:var(--mut);padding:40px 10px}.flash{animation:f 2s}@keyframes f{from{background:#fef9c3}}
</style></head><body>
<header><h1 id="hn">Hospital portal</h1><span class="live"><i></i><span id="up">connecting…</span></span><a id="cons" href="#">Beds &amp; facilities ›</a></header>
<main>
<div class="card" id="rep"></div>
<h2 style="margin:6px 2px 10px;font-size:16px">Incoming patients</h2><div id="list"><div class="empty">Loading…</div></div>
<p class="mut">Answers you give here reach the emergency operator immediately. Accepting reserves a bed if you have reported your beds. This prototype does not replace calling the hospital's emergency desk.</p>
</main>
<script>
const token=location.pathname.split('/')[2];const $=id=>document.getElementById(id);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==='class')e.className=v;else if(x.startsWith('on'))e[x]=v;else e.setAttribute(x,v)}for(const c of k.flat())e.append(c&&c.nodeType?c:document.createTextNode(c??''));return e};
let lastSig=null,lastRep=null,seen=new Set(),first=true,busy=false,typing=false,T=null;
const ago=t=>{const s=Math.max(0,Math.round(Date.now()/1000-t));return s<60?s+'s ago':s<3600?Math.round(s/60)+' min ago':Math.round(s/3600)+' h ago'};
const nice=s=>String(s).replace(/_/g,' ').toLowerCase();
function render(d){
 $('hn').textContent=d.hospital.name;document.title=d.hospital.name+' · Hospital portal';$('cons').href=d.console_url;$('up').textContent='live · updated '+new Date().toLocaleTimeString();
 const beds=Object.entries(d.reported);
 const repSig=JSON.stringify(d.reported);if(repSig!==lastRep){lastRep=repSig;$('rep').replaceChildren(el('div',{class:'k'},'Your last reported beds'),beds.length?el('div',{},beds.map(([k,v])=>el('span',{class:'chip'},nice(k.replace('_beds',''))+': '+v.available+(v.total!=null?' / '+v.total:'')))):el('div',{class:'mut'},'Nothing reported yet. Use "Beds & facilities" so emergency teams can rank you with real numbers.'))}
 const sig=JSON.stringify(d.incoming);if(typing||sig===lastSig)return;lastSig=sig;
 const L=$('list');
 if(!d.incoming.length){L.replaceChildren(el('div',{class:'card empty'},'No incoming patients. This page updates by itself.'));first=false;return}
 L.replaceChildren(...d.incoming.map(p=>{
  const a=p.answer,isNew=!first&&!seen.has(p.message_id);seen.add(p.message_id);
  const loc=p.location||{},maps=loc.lat!=null?`https://www.openstreetmap.org/?mlat=${loc.lat}&mlon=${loc.lng}#map=16/${loc.lat}/${loc.lng}`:null;
  const card=el('div',{class:'card'+(isNew?' flash':'')+(p.another_hospital_accepted&&!a?' stale':'')},
   el('div',{class:'row'},el('span',{class:'pri '+p.priority},p.priority+' urgency'),p.backup?el('span',{class:'chip'},'backup request'):'',el('span',{class:'mut'},'received '+ago(p.received_at)),el('span',{class:'mut'},'case '+p.case_id.slice(0,8))),
   el('p',{},p.condition),
   el('div',{class:'grid'},
    el('div',{},el('div',{class:'k'},'Patient'),[p.patient.age?p.patient.age+' yrs':'age unknown',p.patient.gender||''].filter(Boolean).join(', ')),
    el('div',{},el('div',{class:'k'},'Ambulance ETA to you'),(p.eta_min!=null?Math.round(p.eta_min)+' min':'unknown')+(p.ambulance&&p.ambulance.name?' · '+p.ambulance.name+(p.ambulance.simulated?' (simulated)':''):'')),
    el('div',{},el('div',{class:'k'},'Pick-up location'),(loc.address||'GPS')+(loc.accuracy_m?` (±${Math.round(loc.accuracy_m)} m)`:''),maps?[' ',el('a',{href:maps,target:'_blank',rel:'noopener'},'map ↗')]:'')),
   el('div',{},el('div',{class:'k'},'Needs preparing'),p.needs.length?p.needs.map(n=>el('span',{class:'chip'},nice(n))):el('span',{class:'mut'},'general emergency care')),
   p.symptoms.length?el('div',{},el('div',{class:'k'},'Reported symptoms'),p.symptoms.map(n=>el('span',{class:'chip'},n))):'',
   p.history.length?el('div',{},el('div',{class:'k'},'History'),p.history.map(n=>el('span',{class:'chip'},n))):'',
   p.red_flags.length?el('div',{},el('div',{class:'k'},'Red flags'),p.red_flags.map(n=>el('span',{class:'chip'},nice(typeof n==='string'?n:(n.rule||n.id||n.name||JSON.stringify(n)))))):'');
  if(a)card.append(el('div',{class:'ans '+a.response,style:'margin-top:10px'},(a.response==='ACCEPTED'?'You accepted':'You declined')+' · '+ago(a.received_at)+(a.eta_min!=null?' · prep ETA '+a.eta_min+' min':'')+(a.note?' · “'+a.note+'”':'')+(a.beds&&a.beds.ok?` · bed held (${nice(a.beds.bed_key.replace('_beds',''))} ${a.beds.before}→${a.beds.after})`:'')));
  if(p.another_hospital_accepted&&!a)card.append(el('div',{class:'mut',style:'margin-top:8px'},'Another hospital has already accepted this patient. You can still answer if asked to stand by.'));
  if(!a){
   const f=el('div',{class:'row',style:'margin-top:12px'});
   const beds=el('input',{type:'number',min:0,max:500,placeholder:'free beds now',style:'width:130px'}),eta=el('input',{type:'number',min:0,max:240,placeholder:'prep ETA min',style:'width:120px'}),note=el('input',{placeholder:'note (optional)',maxlength:300,style:'flex:1;min-width:140px'});
   [beds,eta,note].forEach(i=>{i.onfocus=()=>typing=true;i.onblur=()=>typing=false});
   const send=async r=>{if(busy)return;busy=true;f.querySelectorAll('button').forEach(b=>b.disabled=true);
    const res=await fetch(`/portal/${token}/respond`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message_id:p.message_id,response:r,note:note.value,eta_min:eta.value?+eta.value:null,beds_free:beds.value?+beds.value:null})});
    busy=false;typing=false;if(!res.ok){alert((await res.json().catch(()=>({}))).detail||'Could not send your answer. Please phone the operator.')}poll()};
   f.append(beds,eta,note,el('button',{class:'ok',onclick:()=>send('accept')},'Accept patient'),el('button',{class:'no',onclick:()=>send('decline')},'Decline'));card.append(f)}
  return card}));
 first=false}
async function poll(){try{const r=await fetch(`/portal/${token}/data`,{cache:'no-store'});if(!r.ok){$('up').textContent=r.status===404?'this link is not valid':'error '+r.status;if(r.status===404)clearInterval(T);return}render(await r.json())}catch(e){$('up').textContent='offline: retrying…'}}
poll();T=setInterval(poll,4000);
</script></body></html>
